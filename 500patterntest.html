<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>기본 500패턴 퀴즈</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f6f7;
  margin:0;
  padding:20px;
}

h1,h2{
  text-align:center;
}

/* 페이지 전환 */
.page{
  display:none;
}
.page.active{
  display:block;
}

/* ===== 버튼 공통 (아이폰 최적화) ===== */
button{
  padding:10px 14px;
  font-size:15px;
  border-radius:14px;
  border:none;
  cursor:pointer;
}

/* ===== DAY / 퀴즈 개수 버튼 기본 상태 ===== */
.day-buttons button,
.count-buttons button{
  margin:4px;
  min-width:64px;
  background:#ffffff;
  color:#374151;
  border:2px solid #d1d5db;
}

/* ===== DAY / 퀴즈 개수 버튼 선택 상태 ===== */
button.active{
  background:#fde68a;      /* 연한 노랑 */
  color:#92400e;           /* 진한 브라운 */
  border-color:#f59e0b;    /* 주황 테두리 */
  font-weight:600;
}

/* ===== 퀴즈 시작 버튼 (연한 분홍) ===== */
.start-btn{
  width:100%;
  margin-top:18px;
  padding:18px;
  font-size:20px;
  background:#fbcfe8;      /* 연한 분홍 */
  color:#831843;           /* 진한 핑크 글씨 */
  border-radius:18px;
  font-weight:600;
}

/* ===== 퀴즈 박스 ===== */
#quizBox{
  background:white;
  padding:26px;
  border-radius:18px;
  font-size:26px;
  min-height:100px;
}

/* 영어 정답 컬러 */
.pattern{
  color:#e11d48;
  font-weight:bold;
}
.rest{
  color:#000;
}

/* 정답 확인 버튼 */
.check-btn{
  width:100%;
  margin:16px 0;
  background:#2563eb;
  color:white;
  border-radius:18px;
  font-size:20px;
}

/* 맞음 / 틀림 버튼 */
.controls{
  display:flex;
  gap:12px;
}
.correct{
  flex:1;
  background:#16a34a;
  color:white;
}
.wrong{
  flex:1;
  background:#dc2626;
  color:white;
}

/* ===== 결과 화면 ===== */
.result-box{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-top:16px;
  font-size:18px;
  line-height:1.6;
  white-space:pre-line;
}

/* 결과 화면 버튼 */
.action-btn{
  width:100%;
  margin-top:14px;
  background:#4f46e5;
  color:white;
  font-size:20px;
  border-radius:18px;
}
/* ===== 맞음 / 틀림 버튼 세로 크게 ===== */
.correct,
.wrong{
  flex:1;
  min-height:96px;      /* 세로 길이 크게 */
  font-size:20px;
  border-radius:20px;
}
/* ===== 버튼 물방울 리플 효과 ===== */
.ripple-btn{
  position:relative;
  overflow:hidden;
}

.ripple-btn::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:0;
  height:0;
  background:rgba(255,255,255,0.4);
  border-radius:50%;
  transform:translate(-50%,-50%);
  opacity:0;
}

.ripple-btn:active::after{
  width:220%;
  height:220%;
  opacity:1;
  transition:
    width 0.4s ease-out,
    height 0.4s ease-out,
    opacity 0.6s;
}

</style>

<!-- PAGE 1 : 설정 -->
<div class="page active" id="page-setup">
  <h2>DAY 선택</h2>
  <div class="day-buttons" id="dayButtons"></div>

  <h2>퀴즈 개수</h2>
  <div class="count-buttons">
    <button data-count="all" class="active">전체</button>
    <button data-count="10">10</button>
    <button data-count="20">20</button>
    <button data-count="30">30</button>
    <button data-count="40">40</button>
    <button data-count="50">50</button>
    <button data-count="60">60</button>
    <button data-count="70">70</button>
    <button data-count="80">80</button>
    <button data-count="90">90</button>
    <button data-count="100">100</button>
  </div>

  <button class="start-btn" id="startBtn">퀴즈 시작</button>
</div>

<!-- PAGE 2 : 퀴즈 -->
<div class="page" id="page-quiz">
  <div id="quizBox"></div>
  <button class="check-btn" id="showAnswerBtn">정답 확인</button>
  <div class="controls">
    <button class="correct" id="correctBtn">맞음</button>
    <button class="wrong" id="wrongBtn">틀림</button>
  </div>
</div>

<!-- PAGE 3 : 결과 -->
<div class="page" id="page-result">
  <h2>오늘 틀린 문장</h2>
  <div class="result-box" id="wrong-ko"></div>
  <div class="result-box" id="wrong-en"></div>
  <button class="action-btn" id="copyBtn">오늘 틀린 문장 복사</button>
  <button class="action-btn" id="restartBtn">다시 시작</button>
</div>

/********************************************/

/* DAY 버튼 생성 (1~20) */
const dayButtons = document.getElementById("dayButtons");
for(let i=1;i<=20;i++){
  const b=document.createElement("button");
  b.textContent=`DAY ${i}`;
  b.dataset.day=i;
  dayButtons.appendChild(b);
}

/* 상태 */
let selectedDays=new Set();
let quizCount="all";
let quizList=[],idx=0,showAnswer=false,wrongList=[];

/* DAY 선택 */
document.querySelectorAll('.day-buttons button').forEach(b=>{
  b.onclick=()=>{
    b.classList.toggle('active');
    b.classList.contains('active')
      ? selectedDays.add(b.dataset.day)
      : selectedDays.delete(b.dataset.day);
  };
});

/* 퀴즈 개수 */
document.querySelectorAll('.count-buttons button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.count-buttons button')
      .forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    quizCount=b.dataset.count;
  };
});

/* 시작 */
startBtn.onclick=()=>{
  quizList=[]; wrongList=[];
  selectedDays.forEach(d=>{
    if(data[d]) quizList.push(...data[d]);
  });

  if(!quizList.length){
    alert("DAY를 하나 이상 선택해주세요.");
    return;
  }

  shuffle(quizList);

  if(quizCount!=="all"){
    quizList=quizList.slice(0,Math.min(quizCount,quizList.length));
  }

  idx=0; showAnswer=false;
  goPage("page-quiz");
  render();
};

/* 퀴즈 동작 */
showAnswerBtn.onclick=()=>{showAnswer=true;render()};
correctBtn.onclick=()=>next(false);
wrongBtn.onclick=()=>next(true);

function render(){
  const q=quizList[idx];
  quizBox.innerHTML = showAnswer
    ? `<span class="pattern">${q.pattern}</span> <span class="rest">${q.rest}</span>`
    : q.ko;
}

function next(isWrong){
  if(isWrong) wrongList.push(quizList[idx]);
  idx++; showAnswer=false;
  idx>=quizList.length ? showResult() : render();
}

/* 결과 */
function showResult(){
  goPage("page-result");
  const koBox=document.getElementById("wrong-ko");
  const enBox=document.getElementById("wrong-en");

  if(!wrongList.length){
    koBox.textContent="🎉 오늘은 틀린 문장이 없습니다!";
    enBox.textContent="";
    return;
  }

  koBox.textContent =
    wrongList.map((q,i)=>`${i+1}. ${q.ko}`).join("\n");

  enBox.innerHTML =
    wrongList.map((q,i)=>`${i+1}. <span class="pattern">${q.pattern}</span> <span class="rest">${q.rest}</span>`).join("<br>");
}

/* 복사 */
copyBtn.onclick=()=>{
  if(!wrongList.length){
    alert("틀린 문장이 없습니다.");
    return;
  }

  const ko="[오늘 틀린 문장 - 한글]\n\n"+
    wrongList.map((q,i)=>`${i+1}. ${q.ko}`).join("\n");

  const en="\n\n--------------------\n\n[영어 정답]\n\n"+
    wrongList.map((q,i)=>`${i+1}. ${q.pattern} ${q.rest}`).join("\n");

  navigator.clipboard.writeText(ko+en);
};

/* 다시 시작 */
restartBtn.onclick=()=>{
  selectedDays.clear();
  document.querySelectorAll('.day-buttons button')
    .forEach(b=>b.classList.remove("active"));
  goPage("page-setup");
};

/* 유틸 */
function goPage(id){
  document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
</script>
